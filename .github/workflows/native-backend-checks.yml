name: Native backend checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Static audits and portable protocol tests
        run: python tools/run_native_backend_checks.py --require-compiler

  windows-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build production x64
        shell: powershell
        run: .\tools\build.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: HallJoy-Windows-x64
          retention-days: 3
          path: |
            build/release/HallJoy.exe
            build/release/dependency-lock.json
            build/release/THIRD_PARTY_NOTICES.md
            build/release/SHA256SUMS.txt
          if-no-files-found: error
