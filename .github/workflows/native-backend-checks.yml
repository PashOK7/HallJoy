name: Native backend checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    # HallJoy is Windows-only: static audits and every native test run on Windows.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Publication input policy
        run: python tools/check_publication_inputs.py
      - name: Static audits and native tests
        # LLVM clang uses the MSVC runtime: no MinGW libstdc++ DLL mix-up from PATH.
        env:
          CXX: C:/Program Files/LLVM/bin/clang++.exe
        run: python tools/run_native_backend_checks.py --require-compiler

  windows-release:
    # Local release checks are mandatory; hosted Windows builds are opt-in.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build production x64
        shell: powershell
        run: .\tools\build.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: HallJoy-Windows-x64
          retention-days: 3
          path: |
            build/bin/Release/x64/HallJoy.exe
            build/bin/Release/x64/dependency-lock.json
            build/bin/Release/x64/THIRD_PARTY_NOTICES.md
            build/bin/Release/x64/LICENSE
            build/bin/Release/x64/SHA256SUMS.txt
          if-no-files-found: error
